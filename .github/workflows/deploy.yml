name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a rebuild from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deploy at a time; queue any newer push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The repo name becomes the base path GitHub Pages serves from.
      # If you rename the repo, update this value to match.
      - name: Build
        run: npm run build
        env:
          REPO: ${{ github.event.repository.name }}

      - name: Disable Jekyll processing
        run: touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4